<!DOCTYPE html> <!-- Declares document type as HTML5 -->
<html lang="en"> <!-- Root element specifying English language -->
<head> <!-- Head section for page metadata, title, and CSS styles -->
    <meta charset="UTF-8"> <!-- Sets character encoding standard to UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ensures proper responsive scaling on mobile devices -->
    <title>Modern Chess - Menu</title> <!-- Title shown on the browser tab -->
    <style>
        :root { /* Defines global CSS variable color themes */
            --bg-color: #111; /* Dark background fill */
            --panel-bg: #1a1a1a; /* Dark gray panel container background */
            --border-color: #333; /* Standard border line outline color */
            --accent-green: #2ecc71; /* Green highlight for confirm actions */
            --accent-blue: #3498db; /* Blue highlight color */
            --text-main: #ffffff; /* Primary white text color */
            --text-muted: #aaaaaa; /* Subdued gray text color */
        }

        body { /* Global body element style layout rules */
            margin: 0;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            touch-action: manipulation;
            color: var(--text-main);
        }

        .screen { /* Container layout class for each app screen view */
            display: none; /* Hides all screens by default */
            width: 100vw;
            height: 100vh;
            max-width: 540px;
            max-height: 95vh;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .screen.active { /* Makes the target screen visible when active */
            display: flex;
        }

        .screen-header { /* Header container at top of menu screens */
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            background: #222;
        }

        .back-btn { /* Return navigation button style */
            background: #444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .screen-title { /* Centered header title text style */
            margin: 0;
            flex-grow: 1;
            text-align: center;
            font-size: 18px;
            padding-right: 40px;
        }

        .version-badge { /* Software version display pill badge */
            background: #222;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: bold;
            align-self: center;
            margin-top: auto;
            margin-bottom: 8px;
        }

        .screen-body { /* Scrollable body container for menu options */
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-btn { /* Interactive menu navigation button layout */
            background: #262626;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .board-option-card { /* Card layout container for board options */
            background: #222;
            border: 2px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .board-option-card.default-board { /* Highlights default board card choice */
            border-color: var(--accent-green);
        }

        .confirm-btn { /* Selection confirmation action button */
            background: var(--accent-green);
            color: #111;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        #game-screen { /* Game screen specific container layout */
            align-items: center;
            justify-content: center;
        }

        canvas { /* HTML5 Canvas game board element styling */
            background: #222;
            border: 2px solid #444;
            display: block;
            width: 90vw;
            height: 90vw;
            max-width: 500px;
            max-height: 500px;
        }

        .game-top-bar { /* HUD top bar container above the canvas */
            width: 100%;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }
    </style>
</head>
<body> <!-- Document body containing all UI screen views -->

    <!-- Main Menu Screen View -->
    <div id="main-screen" class="screen active">
        <div class="screen-header" style="justify-content: center;">
            <h2 class="screen-title" style="padding-right: 0;">Modern Chess</h2>
        </div>
        <div class="screen-body" style="justify-content: center;">
            <button class="menu-btn" onclick="navigateTo('offline-options-screen')">Play Offline</button>
            <button class="menu-btn" onclick="navigateTo('online-servers-screen')">Play Online</button>
            <button class="menu-btn" onclick="navigateTo('manual-main-screen')">How to Play</button>
            <button class="menu-btn" onclick="navigateTo('files-manager-screen')">Files Manager</button>
            <button class="menu-btn" onclick="navigateTo('settings-screen')">Settings</button>
            <div class="version-badge">v1.308</div>
        </div>
    </div>

    <!-- Offline Options Selection Screen View -->
    <div id="offline-options-screen" class="screen">
        <div class="screen-header">
            <button class="back-btn" onclick="navigateTo('main-screen')">Back</button>
            <h2 class="screen-title">Select Board</h2>
        </div>
        <div class="screen-body">
            <div class="board-option-card default-board">
                <div class="board-info"><h3 style="margin:0;">Basic Board (Default)</h3></div>
                <button class="confirm-btn" onclick="navigateTo('game-screen')">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Active Match Gameplay Screen View -->
    <div id="game-screen" class="screen">
        <div class="game-top-bar">
            <button class="back-btn" onclick="navigateTo('offline-options-screen')">Back</button>
            <span style="font-size: 11px; color: #aaa;"></span>
        </div>
        <div style="display:flex; justify-content:center; align-items:center; flex-grow:1;">
            <canvas id="gameCanvas" width="540" height="540"></canvas>
        </div>
    </div>

    <!-- Screen Navigation Controller Script -->
    <script>
        console.log("[INFO][index_html] DOM content fully parsed, initializing UI navigation controller.");

        function navigateTo(screenId) {
            console.log(`[INFO][index_html] Attempting navigation to screen: '${screenId}'`);
            
            const targetScreen = document.getElementById(screenId);
            if (!targetScreen) {
                console.error(`[ERROR][index_html] Navigation failed: Screen element with ID '${screenId}' does not exist.`);
                return;
            }

            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });

            targetScreen.classList.add('active');
            console.log(`[SUCCESS][index_html] Successfully navigated to screen: '${screenId}'`);
        }

        // Global window error listener for robust client-side error tracing and chat box parsing
        window.addEventListener('error', function(event) {
            console.error(`[ERROR][global_window] Uncaught error detected: ${event.message} at ${event.filename}:${event.lineno}`);
        });

        window.addEventListener('load', () => {
            console.log("[SUCCESS][index_html] Window fully loaded, all assets and styles initialized.");
        });
    </script>
    
    <!-- REQUIRED SCRIPT LOAD ORDER -->
    <script src="map_setup.js" onerror="console.error('[ERROR][index_html] Failed to load script: map_setup.js');"></script>
    <script src="team_mechanics.js" onerror="console.error('[ERROR][index_html] Failed to load script: team_mechanics.js');"></script>
    <script src="unit_movement.js" onerror="console.error('[ERROR][index_html] Failed to load script: unit_movement.js');"></script>
</body>
</html>
