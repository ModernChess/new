<!DOCTYPE html> <!-- Declares document type as HTML5 -->
<html lang="en"> <!-- Root element specifying English language -->
<head> <!-- Head section for page metadata, title, and CSS styles -->
    <meta charset="UTF-8"> <!-- Sets character encoding standard to UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ensures proper responsive scaling on mobile devices -->
    <title>Modern Chess - Menu</title> <!-- Title shown on the browser tab -->
    <style>
        :root { /* Defines global CSS variable color themes */
            --bg-color: #111; /* Dark background fill */
            --panel-bg: #1a1a1a; /* Dark gray panel container background */
            --border-color: #333; /* Standard border line outline color */
            --accent-green: #2ecc71; /* Green highlight for confirm actions */
            --accent-blue: #3498db; /* Blue highlight color */
            --text-main: #ffffff; /* Primary white text color */
            --text-muted: #aaaaaa; /* Subdued gray text color */
        }

        body { /* Global body element style layout rules */
            margin: 0;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            touch-action: manipulation;
            color: var(--text-main);
        }

        .screen { /* Container layout class for each app screen view */
            display: none; /* Hides all screens by default */
            width: 100vw;
            height: 100vh;
            max-width: 540px;
            max-height: 95vh;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .screen.active { /* Makes the target screen visible when active */
            display: flex;
        }

        .screen-header { /* Header container at top of menu screens */
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            background: #222;
        }

        .back-btn { /* Return navigation button style */
            background: #444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .screen-title { /* Centered header title text style */
            margin: 0;
            flex-grow: 1;
            text-align: center;
            font-size: 18px;
            padding-right: 40px;
        }

        .version-badge { /* Software version display pill badge */
            background: #222;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: bold;
            align-self: center;
            margin-top: auto;
            margin-bottom: 8px;
        }

        .screen-body { /* Scrollable body container for menu options */
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-btn { /* Interactive menu navigation button layout */
            background: #262626;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .board-option-card { /* Card layout container for board options */
            background: #222;
            border: 2px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .board-option-card.default-board { /* Highlights default board card choice */
            border-color: var(--accent-green);
        }

        .confirm-btn { /* Selection confirmation action button */
            background: var(--accent-green);
            color: #111;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        #game-screen { /* Game screen specific container layout */
            align-items: center;
            justify-content: center;
        }

        canvas { /* HTML5 Canvas game board element styling */
            background: #222;
            border: 2px solid #444;
            display: block;
            width: 90vw;
            height: 90vw;
            max-width: 500px;
            max-height: 500px;
        }

        .game-top-bar { /* HUD top bar container above the canvas */
            width: 100%;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        /* Shop UI Button & Modal Styles */
        #shop-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #f1c40f;
            color: #121212;
            border: none;
            padding: 8px 14px;
            font-weight: bold;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            z-index: 10;
            transition: background 0.2s;
        }
        #shop-btn:hover {
            background-color: #f39c12;
        }
        #shop-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #f1c40f;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            z-index: 20;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }
        #shop-modal h3 {
            margin-top: 0;
            color: #f1c40f;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 16px;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .shop-item button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .shop-item button:hover {
            background-color: #2ecc71;
        }
        #close-shop {
            width: 100%;
            margin-top: 12px;
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        #close-shop:hover {
            background-color: #e74c3c;
        }

        /* Artillery Card Duel Modal Styles */
        #artillery-card-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.98);
            border: 2px solid #e74c3c;
            padding: 24px;
            border-radius: 12px;
            width: 320px;
            z-index: 30;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            box-sizing: border-box;
            text-align: center;
        }
        #artillery-card-modal h3 {
            margin-top: 0;
            color: #e74c3c;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 18px;
        }
        #artillery-card-modal p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }
        .card-duel-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .duel-card-btn {
            padding: 12px 20px;
            font-weight: bold;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #fff;
        }
        .duel-card-btn.green {
            background-color: #27ae60;
        }
        .duel-card-btn.green:hover {
            background-color: #2ecc71;
        }
        .duel-card-btn.red {
            background-color: #c0392b;
        }
        .duel-card-btn.red:hover {
            background-color: #e74c3c;
        }
    </style>
</head>
<body> <!-- Document body containing all UI screen views -->

    <!-- Main Menu Screen View -->
    <div id="main-screen" class="screen active">
        <div class="screen-header" style="justify-content: center;">
            <h2 class="screen-title" style="padding-right: 0;">Modern Chess</h2>
        </div>
        <div class="screen-body" style="justify-content: center;">
            <button class="menu-btn" onclick="navigateTo('offline-options-screen')">Play</button>
            <button class="menu-btn disabled" onclick="event.preventDefault();">How to Play</button>
            <button class="menu-btn disabled" onclick="event.preventDefault();">Files Manager</button>
            <button class="menu-btn disabled" onclick="event.preventDefault();">Settings</button>
            <div class="version-badge">v1.368</div>
        </div>
    </div>

    <!-- Offline Options Selection Screen View -->
    <div id="offline-options-screen" class="screen">
        <div class="screen-header">
            <button class="back-btn" onclick="navigateTo('main-screen')">Back</button>
            <h2 class="screen-title">Select Board</h2>
        </div>
        <div class="screen-body">
            <!-- 1. Default Basic Board Card -->
            <div class="board-option-card default-board" id="card-basic-board">
                <div class="board-info">
                    <h3 style="margin:0;">Basic Board (Default)</h3>
                    <small style="color: var(--text-muted);">18x18 Grid Map (9x9 Macro)</small>
                </div>
                <button class="confirm-btn" onclick="selectAndStartBoard('basic')">Confirm</button>
            </div>

            <!-- 2. Larger Basic Board Card -->
            <div class="board-option-card" id="card-larger-board">
                <div class="board-info">
                    <h3 style="margin:0;">Larger Basic Board</h3>
                    <small style="color: var(--text-muted);">24x34 Grid Map (12x17 Macro)</small>
                </div>
                <button class="confirm-btn" onclick="selectAndStartBoard('larger_basic')">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Active Match Gameplay Screen View -->
    <div id="game-screen" class="screen">
        <div class="game-top-bar">
            <button class="back-btn" onclick="navigateTo('offline-options-screen')">Back</button>
            <button id="shop-btn" onclick="toggleShop()">🛒 Open Shop</button>
        </div>
        <div style="display:flex; justify-content:center; align-items:center; flex-grow:1; position:relative;">
            <canvas id="gameCanvas" width="540" height="540"></canvas>

            <!-- Shop Modal Menu -->
            <div id="shop-modal">
                <h3>Unit Recruitment Shop</h3>
                <div class="shop-item">
                    <span>2x Infantry (1 Gold)</span>
                    <button onclick="buyUnit('infantry')">Buy</button>
                </div>
                <div class="shop-item">
                    <span>1x Tank (1 Gold)</span>
                    <button onclick="buyUnit('tank')">Buy</button>
                </div>
                <div class="shop-item">
                    <span>1x Artillery (2 Gold)</span>
                    <button onclick="buyUnit('artillery')">Buy</button>
                </div>
                <div class="shop-item">
                    <span>1x Ship (2 Gold)</span>
                    <button onclick="buyUnit('ship')">Buy</button>
                </div>
                <button id="close-shop" onclick="toggleShop()">Close Shop</button>
            </div>

            <!-- Artillery Card Duel Modal Menu -->
            <div id="artillery-card-modal">
                <h3 id="duel-modal-title">Artillery Card Duel</h3>
                <p id="duel-modal-desc">Attacker is choosing a card color...</p>
                <div class="card-duel-options" id="duel-button-container">
                    <button class="duel-card-btn green" onclick="attackerChooseCard('green')">Green Card</button>
                    <button class="duel-card-btn red" onclick="attackerChooseCard('red')">Red Card</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Screen Navigation Controller Script -->
    <script>
        console.log("[INFO][index_html] DOM content fully parsed, initializing UI navigation controller.");

        // Board Configurations Dictionary
        window.selectedBoardType = 'basic';
        window.BOARD_CONFIGS = {
            basic: {
                type: 'basic',
                cols: 18,
                rows: 18,
                macroCols: 9,
                macroRows: 9,
                tileSize: 30
            },
            larger_basic: {
                type: 'larger_basic',
                cols: 24,
                rows: 34,
                macroCols: 12,
                macroRows: 17,
                tileSize: 30
            }
        };

        // Select Board Type and Launch Game Engine
        function selectAndStartBoard(boardType) {
            window.selectedBoardType = boardType;
            const config = window.BOARD_CONFIGS[boardType] || window.BOARD_CONFIGS.basic;
            window.ACTIVE_BOARD_CONFIG = config;

            // Resize HTML5 Canvas dimensions according to grid configuration
            const canvas = document.getElementById('gameCanvas');
            if (canvas) {
                canvas.width = config.cols * config.tileSize;
                canvas.height = config.rows * config.tileSize;
            }

            console.log(`[INFO][index_html] Board selected: '${boardType}' (${config.cols}x${config.rows} Grid). Initializing map...`);

            if (typeof window.initGameMap === 'function') {
                window.initGameMap(config);
            }

            navigateTo('game-screen');
        }

        function navigateTo(screenId) {
            console.log(`[INFO][index_html] Attempting navigation to screen: '${screenId}'`);
            
            const targetScreen = document.getElementById(screenId);
            if (!targetScreen) {
                console.error(`[ERROR][index_html] Navigation failed: Screen element with ID '${screenId}' does not exist.`);
                return;
            }

            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });

            targetScreen.classList.add('active');
            console.log(`[SUCCESS][index_html] Successfully navigated to screen: '${screenId}'`);
        }

        // Global window error listener for robust client-side error tracing and chat box parsing
        window.addEventListener('error', function(event) {
            console.error(`[ERROR][global_window] Uncaught error detected: ${event.message} at ${event.filename}:${event.lineno}`);
        });

        window.addEventListener('load', () => {
            console.log("[SUCCESS][index_html] Window fully loaded, all assets and styles initialized.");
        });
    </script>

    <!-- REQUIRED SCRIPT LOAD ORDER -->
    <script src="console.js" onerror="console.error('[ERROR][index_html] Failed to load script: console.js');"></script>
    <script src="map_setup.js" onerror="console.error('[ERROR][index_html] Failed to load script: map_setup.js');"></script>
    <script src="team_core.js" onerror="console.error('[ERROR][index_html] Failed to load script: team_core.js');"></script>
    <script src="combat_mechanics.js" onerror="console.error('[ERROR][index_html] Failed to load script: combat_mechanics.js');"></script>
    <script src="unit_movement.js" onerror="console.error('[ERROR][index_html] Failed to load script: unit_movement.js');"></script>
</body>
</html>
