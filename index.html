<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Tap Game & Chat</title>
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
        }

        /* Version Sidebar Badge */
        .version-badge {
            position: fixed;
            top: 15px;
            right: 15px;
            background: #ff9800;
            color: #121212;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            letter-spacing: 0.5px;
            z-index: 1000;
        }

        /* Login Screen Styles */
        #login-screen {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        #login-screen h2 {
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
        }

        /* Scrollable List of Available Players */
        .available-users-box {
            background: #161616;
            border: 1px solid #333;
            border-radius: 8px;
            max-height: 110px;
            overflow-y: auto;
            margin-bottom: 15px;
            text-align: left;
            padding: 8px;
        }

        .available-users-box .list-title {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .available-user-item {
            font-size: 0.85rem;
            color: #b0bec5;
            padding: 3px 5px;
            border-bottom: 1px solid #222;
        }

        .available-user-item:last-child {
            border-bottom: none;
        }

        #login-btn {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        #error-msg {
            color: #ff5252;
            font-size: 0.8rem;
            margin-top: 10px;
            min-height: 15px;
        }

        /* Game Screen Styles */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 350px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
        }

        #player-welcome {
            font-size: 1rem;
            color: #4CAF50;
            font-weight: bold;
        }

        #logout-btn {
            background: #ff5252;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* Expanding Player List Dropdown with Green Circle Indicator */
        .player-dropdown {
            width: 100%;
            background: #1e1e1e;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .dropdown-header {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .indicator-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .online-circle {
            width: 10px;
            height: 10px;
            background-color: #4CAF50;
            border-radius: 50%;
            box-shadow: 0 0 6px #4CAF50;
        }

        .dropdown-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: #161616;
            border-top: 1px solid #2a2a2a;
        }

        .player-dropdown.open .dropdown-content {
            max-height: 200px;
        }

        .player-item {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            font-size: 0.9rem;
            border-bottom: 1px solid #222;
        }

        .player-item:last-child {
            border-bottom: none;
        }

        /* Chat Widget Panel */
        .chat-widget {
            width: 100%;
            background: #1e1e1e;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            overflow: hidden;
            box-sizing: border-box;
        }

        .chat-toggle-bar {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #252525;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            color: #2196F3;
        }

        .chat-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            display: flex;
            flex-direction: column;
            background: #161616;
        }

        .chat-widget.open .chat-body {
            max-height: 220px;
        }

        .chat-messages {
            height: 140px;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-sizing: border-box;
        }

        .chat-msg {
            font-size: 0.85rem;
            background: #222;
            padding: 6px 10px;
            border-radius: 8px;
            word-break: break-word;
            line-height: 1.2;
        }

        .chat-msg span.sender {
            font-weight: bold;
            margin-right: 5px;
        }

        .chat-input-area {
            display: flex;
            border-top: 1px solid #2a2a2a;
            padding: 8px;
            background: #1e1e1e;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 6px 10px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }

        .chat-input-area button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* Activity Log Ticker */
        #activity-log {
            background: #1e1e1e;
            color: #b0bec5;
            font-size: 0.8rem;
            padding: 8px 15px;
            border-radius: 20px;
            margin-bottom: 15px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Secret Action Notification Label */
        #secret-log {
            color: #ffeb3b;
            font-size: 0.8rem;
            margin-bottom: 15px;
            min-height: 20px;
            text-align: center;
            font-weight: bold;
        }

        h2 {
            margin-bottom: 10px;
            font-size: 1.1rem;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
        }

        .circle {
            aspect-ratio: 1;
            background-color: #333333;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .circle:active {
            transform: scale(0.95);
        }

        /* Private Bar Section */
        .private-section {
            width: 100%;
            background: #181818;
            padding: 15px;
            border-radius: 15px;
            box-sizing: border-box;
            border: 1px dashed #444;
        }

        .private-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
        }

        .private-circle {
            aspect-ratio: 1;
            background-color: #444;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .private-circle:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Version Badge -->
    <div class="version-badge">v3.0-Clean</div>

    <!-- Login Container -->
    <div id="login-screen">
        <h2>Player Login</h2>
        
        <!-- Scrollable list of available players instead of placeholder hints -->
        <div class="available-users-box">
            <div class="list-title">Registered Players</div>
            <div class="available-user-item">Taiyeeb</div>
            <div class="available-user-item">Ajwaad</div>
            <div class="available-user-item">Arafat</div>
            <div class="available-user-item">Yusuf</div>
            <div class="available-user-item">Munim</div>
            <div class="available-user-item">Tamim</div>
        </div>

        <div class="input-group">
            <label>Username</label>
            <input type="text" id="usernameInput" placeholder="Enter username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="passwordInput" placeholder="Enter password">
        </div>
        <button id="login-btn">Login & Join</button>
        <div id="error-msg"></div>
    </div>

    <!-- Game Container -->
    <div id="game-screen">
        <div class="top-bar">
            <div id="player-welcome"></div>
            <button id="logout-btn">Log Out</button>
        </div>

        <!-- Expanding Player List Component with Green Circle Indicator -->
        <div class="player-dropdown" id="playerDropdown">
            <div class="dropdown-header" id="dropdownToggle">
              <span>Connected Players</span>
              <div class="indicator-group">
                  <div class="online-circle"></div>
                  <span id="playerCount">(0)</span>
              </div>
            </div>
            <div class="dropdown-content" id="playerListContainer"></div>
        </div>

        <!-- Chat Widget Panel -->
        <div class="chat-widget" id="chatWidget">
            <div class="chat-toggle-bar" id="chatToggleBtn">
                <span>Global Chat Box</span>
                <span id="chatArrow">▼</span>
            </div>
            <div class="chat-body">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Type message to chat...">
                    <button id="chatSendBtn">Send</button>
                </div>
            </div>
        </div>

        <!-- Activity Log Box -->
        <div id="activity-log">Waiting for actions...</div>

        <!-- Secret Action Label -->
        <div id="secret-log"></div>

        <h2>Shared Circles</h2>
        <div class="grid" id="grid"></div>

        <!-- Private Local Bar Section -->
        <div class="private-section">
            <h2>Private Bar (Server Saved)</h2>
            <div class="private-grid" id="privateGrid"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            projectId: "tapgame-28bc3",
            databaseURL: "https://tapgame-28bc3-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const loginScreen = document.getElementById('login-screen');
        const gameScreen = document.getElementById('game-screen');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('login-btn');
        const errorMsg = document.getElementById('error-msg');
        const playerWelcome = document.getElementById('player-welcome');
        const logoutBtn = document.getElementById('logout-btn');
        
        const dropdownToggle = document.getElementById('dropdownToggle');
        const playerDropdown = document.getElementById('playerDropdown');
        const playerCount = document.getElementById('playerCount');
        const playerListContainer = document.getElementById('playerListContainer');
        const activityLog = document.getElementById('activity-log');
        const secretLog = document.getElementById('secret-log');

        const chatWidget = document.getElementById('chatWidget');
        const chatToggleBtn = document.getElementById('chatToggleBtn');
        const chatArrow = document.getElementById('chatArrow');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const chatSendBtn = document.getElementById('chatSendBtn');

        // New profiles with requested credentials and fixed colors for name tagging
        const userProfiles = {
            "Taiyeeb": { pass: "wolf", color: "#FF5733" },
            "Ajwaad": { pass: "anime", color: "#33FF57" },
            "Arafat": { pass: "siddique", color: "#3357FF" },
            "Yusuf": { pass: "philosophy", color: "#F3FF33" },
            "Munim": { pass: "science", color: "#FF33F3" },
            "Tamim": { pass: "debate", color: "#33FFF0" }
        };

        const savedUser = localStorage.getItem('tapGameUser');
        if (savedUser && userProfiles[savedUser]) {
            startApp(savedUser);
        }

        dropdownToggle.addEventListener('click', () => {
            playerDropdown.classList.toggle('open');
        });

        chatToggleBtn.addEventListener('click', () => {
            chatWidget.classList.toggle('open');
            chatArrow.textContent = chatWidget.classList.contains('open') ? '▲' : '▼';
        });

        loginBtn.addEventListener('click', () => {
            const enteredUser = usernameInput.value.trim();
            const enteredPass = passwordInput.value.trim();

            if (userProfiles[enteredUser] && userProfiles[enteredUser].pass === enteredPass) {
                localStorage.setItem('tapGameUser', enteredUser);
                startApp(enteredUser);
            } else {
                errorMsg.textContent = "Invalid username or password!";
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('tapGameUser');
            window.location.reload();
        });

        function startApp(playerName) {
            loginScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            playerWelcome.textContent = `Hi, ${playerName}!`;

            const connectionsRef = ref(db, 'connections');
            const myConnectionRef = push(connectionsRef);

            set(myConnectionRef, { name: playerName });
            onDisconnect(myConnectionRef).remove();

            onValue(connectionsRef, (snapshot) => {
                const data = snapshot.val();
                playerListContainer.innerHTML = '';
                
                if (data) {
                    const activeUsers = Object.values(data);
                    playerCount.textContent = `(${activeUsers.length})`;
                    
                    activeUsers.forEach(user => {
                        const item = document.createElement('div');
                        item.classList.add('player-item');
                        item.textContent = user.name;
                        playerListContainer.appendChild(item);
                    });
                } else {
                    playerCount.textContent = `(0)`;
                }
            });

            // Shared Circles & Activity Log Logic
            const circlesRef = ref(db, 'circles');
            const lastActionRef = ref(db, 'lastAction');
            const secretActionRef = ref(db, 'secretAction');
            
            const grid = document.getElementById('grid');
            const totalCircles = 8;
            const colors = ['#FF5733', '#33FF57', '#3357FF', '#F3FF33', '#FF33F3', '#33FFF0', '#FFA533', '#A533FF'];
            const circleElements = [];
            
            for (let i = 0; i < totalCircles; i++) {
                const circle = document.createElement('div');
                circle.classList.add('circle');
                
                circle.addEventListener('click', () => {
                    const randomColor = colors[Math.floor(Math.random() * colors.length)];
                    set(ref(db, `circles/${i}`), randomColor);
                    set(lastActionRef, { player: playerName, color: randomColor });
                });

                grid.appendChild(circle);
                circleElements.push(circle);
            }

            onValue(circlesRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    data.forEach((color, index) => {
                        if (color && circleElements[index]) {
                            circleElements[index].style.backgroundColor = color;
                        }
                    });
                }
            });

            onValue(lastActionRef, (snapshot) => {
                const action = snapshot.val();
                if (action) {
                    activityLog.textContent = `${action.player} changed color to ${action.color}`;
                }
            });

            // Private Bar Logic (Saved on Server per player)
            const privateGrid = document.getElementById('privateGrid');
            const totalPrivateCircles = 4;
            const privateCirclesRef = ref(db, `privateBars/${playerName}`);
            const privateCircleElements = [];
            
            for (let i = 0; i < totalPrivateCircles; i++) {
                const pCircle = document.createElement('div');
                p
