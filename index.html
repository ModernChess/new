<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Chess - Menu</title>
    <style>
        :root {
            --bg-color: #111;
            --panel-bg: #1a1a1a;
            --border-color: #333;
            --accent-green: #2ecc71;
            --accent-blue: #3498db;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            margin: 0;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            touch-action: manipulation;
            color: var(--text-main);
        }

        .screen {
            display: none;
            width: 100vw;
            height: 100vh;
            max-width: 540px;
            max-height: 95vh;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .screen.active {
            display: flex;
        }

        .screen-header {
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            background: #222;
        }

        .back-btn {
            background: #444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .screen-title {
            margin: 0;
            flex-grow: 1;
            text-align: center;
            font-size: 18px;
            padding-right: 40px;
        }

        .version-badge {
            background: #222;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: bold;
            align-self: center;
            margin-top: auto;
            margin-bottom: 8px;
        }

        .screen-body {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-btn {
            background: #262626;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .board-option-card {
            background: #222;
            border: 2px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .board-option-card.default-board {
            border-color: var(--accent-green);
        }

        .confirm-btn {
            background: var(--accent-green);
            color: #111;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        #game-screen {
            align-items: center;
            justify-content: center;
        }

        canvas {
            background: #222;
            border: 2px solid #444;
            display: block;
            width: 90vw;
            height: 90vw;
            max-width: 500px;
            max-height: 500px;
        }

        .game-top-bar {
            width: 100%;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="main-screen" class="screen active">
        <div class="screen-header" style="justify-content: center;">
            <h2 class="screen-title" style="padding-right: 0;">Modern Chess</h2>
        </div>
        <div class="screen-body" style="justify-content: center;">
            <button class="menu-btn" onclick="navigateTo('offline-options-screen')">Play Offline</button>
            <button class="menu-btn" onclick="navigateTo('online-servers-screen')">Play Online</button>
            <button class="menu-btn" onclick="navigateTo('manual-main-screen')">How to Play</button>
            <button class="menu-btn" onclick="navigateTo('files-manager-screen')">Files Manager</button>
            <button class="menu-btn" onclick="navigateTo('settings-screen')">Settings</button>
            <div class="version-badge">v1.245</div>
        </div>
    </div>

    <div id="offline-options-screen" class="screen">
        <div class="screen-header">
            <button class="back-btn" onclick="navigateTo('main-screen')">Back</button>
            <h2 class="screen-title">Select Board</h2>
        </div>
        <div class="screen-body">
            <div class="board-option-card default-board">
                <div class="board-info"><h3 style="margin:0;">Basic Board (Default)</h3></div>
                <button class="confirm-btn" onclick="navigateTo('game-screen')">Confirm</button>
            </div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="game-top-bar">
            <button class="back-btn" onclick="navigateTo('offline-options-screen')">Back</button>
            <span style="font-size: 11px; color: #aaa;"></span>
        </div>
        <div style="display:flex; justify-content:center; align-items:center; flex-grow:1;">
            <canvas id="gameCanvas" width="540" height="540"></canvas>
        </div>
    </div>

    <!-- Other screens omitted for brevity, keeping all scripts loaded below -->
    <script>
        function navigateTo(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }
    </script>
    
    <!-- REQUIRED SCRIPT LOAD ORDER -->
    <script src="map_setup.js"></script>
    <script src="team_mechanics.js"></script>
    <script src="unit_movement.js"></script>
</body>
</html>
